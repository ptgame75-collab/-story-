<!DOCTYPE html>
<html lang="ne" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अधिराज Story - Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="google" content="notranslate">
    <style>
        /* वेलकम स्क्रिनका लागि विशेष स्टाइल */
        #loadingScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-content { text-align: center; }
        .progress-container {
            width: 200px; height: 4px;
            background: #444;
            margin: 20px auto 0;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%; height: 100%;
            background: #d32f2f;
            animation: load 2s linear forwards;
        }
        @keyframes load { to { width: 100%; } }
        .welcome-btn {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body class="day-mode">

    <div id="loadingScreen">
        <div class="loading-content">
            <h1 class="snickles-font" style="color:white;">Aadhiraj Story</h1>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <!-- प्रोग्रेस बार सकिएपछि देखिने बटन -->
            <div id="enterApp" class="welcome-btn">
                <a href="home.html" class="btn" style="border-color: #d32f2f; color: #d32f2f;">डायरी खोल्नुहोस् →</a>
            </div>
        </div>
    </div>

    <script>
        // २ सेकेन्डपछि प्रोग्रेस बार सकिएपछि प्रवेश बटन देखाउने
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('enterApp').style.display = 'block';
                // यदि प्रयोगकर्ताले क्लिक नगरे पनि १ सेकेन्डपछि आफैं रिडाइरेक्ट गराउन चाहेमा:
                setTimeout(() => {
                    document.body.classList.add('fade-out');
                    window.location.href = "home.html";
                }, 1500);
            }, 2000);
        };
    </script>
</body>
</html>
