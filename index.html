<!DOCTYPE html>
<html lang="ne" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अधिराज Story</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="google" content="notranslate">
    <link rel="apple-touch-icon" href="new-logo.png">
</head>
<body class="day-mode">

    <div id="loadingScreen">
        <div class="loading-content">
            <h1 style="color:white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">Aadhiraj Story</h1>
            <div class="progress-container"><div class="progress-bar"></div></div>
        </div>
    </div>

    <div id="homePage">
        <header>
            <div class="logo-text">✍🏻 अधिराज Story</div>
        </header>

        <nav class="tab-nav">
            <div id="tab0" class="active" onclick="switchTab(0)">हिन्दी कथाहरू</div>
            <div id="tab1" onclick="switchTab(1)">नेपाली कथाहरू</div>
        </nav>

        <div class="main-wrapper" id="contentWrapper">
            <section id="hindiSection">
                <div class="story-title-card" onclick="openStory('वियोग का सिन्दुर', 'h1')">
                    <span class="badge">कहानी १</span>
                    <h3>वियोग का सिन्दुर</h3>
                </div>
                <div class="story-title-card" onclick="openStory('गरीबी और सपनों की नींव', 'h2')">
                    <span class="badge">कहानी २</span>
                    <h3>गरीबी और सपनों की नींव</h3>
                </div>
            </section>

            <section id="nepaliSection">
                <div class="story-title-card nepali-card" onclick="openStory('वैवाहिक वेश्या', 'n1')">
                    <span class="badge nepali-badge">कथा १</span>
                    <h3>वैवाहिक वेश्या</h3>
                </div>
                <div class="story-title-card nepali-card" onclick="openStory('अधुरो प्रतिज्ञा', 'n2')">
                    <span class="badge nepali-badge">कथा २</span>
                    <h3>अधुरो प्रतिज्ञा</h3>
                </div>
                <div class="story-title-card nepali-card" onclick="openStory('दिदीको समर्पण', 'n3')">
                    <span class="badge nepali-badge">कथा ३</span>
                    <h3>दिदीको समर्पण</h3>
                </div>
                <div class="story-title-card nepali-card" onclick="openStory('लालुङको याद', 'n4')">
                    <span class="badge nepali-badge">कथा ४</span>
                    <h3>लालुङको याद</h3>
                </div>
                <div class="story-title-card nepali-card" onclick="openStory('बाजेको चिठी', 'n5')">
                    <span class="badge nepali-badge">कथा ५</span>
                    <h3>बाजेको चिठी</h3>
                </div>
            </section>
        </div>
    </div>

    <div id="storyView" class="story-view-overlay">
        <div class="story-header">
            <button class="back-btn" onclick="closeStory()">←</button>
            <div style="flex-grow:1;"></div>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
        
        <div class="story-content-area">
            <div class="title-wrapper">
                <h1 id="viewTitle" class="inner-story-title">शीर्षक</h1>
                <button onclick="speakStory()" class="play-btn" id="voiceBtn">▶️</button>
            </div>
            <div class="font-tools">
                <button onclick="changeFontSize(2)">A+</button>
                <button onclick="changeFontSize(-2)">A-</button>
            </div>
            <div id="storyBody" class="story-body-text"></div>
            <div class="story-footer">
                <div class="author-name">लेखक: अधिराज सुनार</div>
                <div id="victoryTag" class="victory-msg">प्रतीक्षा...</div>
                <div class="thanks-msg">♡︎ thanks for reading ♡︎</div>
            </div>
        </div>
    </div>

    <script src="nepali-stories.js"></script>
    <script src="hindi-stories.js"></script>
    
    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        function switchTab(index) {
            const wrapper = document.getElementById('contentWrapper');
            wrapper.style.transform = `translateX(-${index * 50}%)`;
            document.querySelectorAll('.tab-nav div').forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
            });
        }

        function openStory(title, id) {
            const storyBody = document.getElementById('storyBody');
            const victoryTag = document.getElementById('victoryTag');
            const content = id.startsWith('n') ? nepaliStories[id] : hindiStories[id];
            document.getElementById('viewTitle').innerText = title;
            storyBody.innerHTML = content;

            const config = {
                n1: { msg: "सिन्दुरको चिहान", color: "#FF0000" },
                n2: { msg: "एकलव्य प्रेम", color: "#007BFF" },
                n3: { msg: "त्यागको मूर्ति", color: "#28A745" },
                n4: { msg: "पवित्र बिछोड", color: "#4B0082" },
                n5: { msg: "बाजेको चिठी", color: "#8B4513" },
                h1: { msg: "अमर सुहागन", color: "#B22222" },
                h2: { msg: "टुटा भरोसा", color: "#4A4A4A" }
            };

            if(config[id]) {
                victoryTag.innerText = config[id].msg;
                victoryTag.style.color = config[id].color;
            }

            const sv = document.getElementById('storyView');
            sv.style.display = 'block';
            setTimeout(() => sv.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
            window.speechSynthesis.cancel(); 
        }

        function closeStory() {
            window.speechSynthesis.cancel();
            const sv = document.getElementById('storyView');
            sv.classList.remove('active');
            setTimeout(() => {
                sv.style.display = 'none';
                document.getElementById('voiceBtn').innerHTML = "▶️";
            }, 400);
            document.body.style.overflow = 'auto';
        }

        function toggleTheme() { document.body.classList.toggle('night-mode'); }
        let currentFS = 18;
        function changeFontSize(d) { 
            currentFS += d; 
            document.getElementById('storyBody').style.fontSize = currentFS + 'px'; 
        }

        function speakStory() {
            const btn = document.getElementById('voiceBtn');
            if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
                window.speechSynthesis.pause();
                btn.innerHTML = "▶️";
                return;
            }
            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
                btn.innerHTML = "⏸️";
                return;
            }
            const text = document.getElementById('storyBody').innerText;
            const speech = new SpeechSynthesisUtterance(text);
            const isHindi = /[\u0900-\u097F]/.test(text);
            speech.lang = isHindi ? 'hi-IN' : 'ne-NP';
            speech.rate = 0.85;
            speech.onend = () => { btn.innerHTML = "▶️"; };
            window.speechSynthesis.speak(speech);
            btn.innerHTML = "⏸️";
        }

        let touchStartX = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, false);
        document.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].clientX;
            let diff = touchStartX - touchEndX;
            const storyView = document.getElementById('storyView');
            if (storyView.style.display !== 'block') {
                if (diff > 80) switchTab(1);
                if (diff < -80) switchTab(0);
            }
        }, false);

        window.onload = () => {
            setTimeout(() => {
                const ls = document.getElementById('loadingScreen');
                if(ls) {
                    ls.style.opacity = '0';
                    setTimeout(() => ls.style.display = 'none', 500);
                }
            }, 2000);
        };
    </script>
</body>
</html>
